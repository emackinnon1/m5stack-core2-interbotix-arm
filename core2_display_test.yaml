esphome:
  libraries:
    - Wire
  on_boot:
    - priority: 700
      then:
        - lambda: |-
            id(core2_test_power).set_brightness(1.0f);
            id(core2_test_power).update();
            ESP_LOGI("display_test", "Display power initialized; backlight set to full brightness");

esp32:
  board: m5stack-core2
  framework:
    type: arduino

psram:
  mode: quad
  speed: 80MHz

external_components:
  - source: github://martydingo/esphome-axp192
    components: [axp192]

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23

i2c:
  - id: core2_test_i2c
    sda: GPIO21
    scl: GPIO22
    scan: true

sensor:
  - platform: axp192
    id: core2_test_power
    model: M5CORE2
    address: 0x34
    i2c_id: core2_test_i2c
    setup_priority: 810
    update_interval: 30s
    battery_level:
      id: core2_test_battery
      internal: true

display:
  - platform: mipi_spi
    id: core2_test_display
    model: M5CORE2
    data_rate: 10MHz
    buffer_size: 100%
    auto_clear_enabled: true
    update_interval: 250ms
    lambda: |-
      const int width = it.get_width();
      const int height = it.get_height();
      const int bar_width = width / 3;
      it.fill(Color(0, 0, 0));
      it.filled_rectangle(0, 0, bar_width, height - 40, Color(255, 0, 0));
      it.filled_rectangle(bar_width, 0, bar_width, height - 40, Color(0, 255, 0));
      it.filled_rectangle(bar_width * 2, 0, width - bar_width * 2, height - 40, Color(0, 0, 255));
      it.rectangle(0, 0, width, height, Color(255, 255, 255));
      const int marker_x = (millis() / 50) % (width - 20);
      it.filled_rectangle(marker_x, height - 30, 20, 20, Color(255, 255, 255));

interval:
  - interval: 5s
    then:
      - lambda: |-
          ESP_LOGI("display_test", "Test running: uptime=%us, display=%dx%d",
                   static_cast<unsigned>(millis() / 1000),
                   id(core2_test_display).get_width(), id(core2_test_display).get_height());