lvgl:
  pages:
    - id: core2_beer_brands_coming_soon_page
      bg_color: 0x000000
      on_load:
        - globals.set:
            id: beer_opener_page_active
            value: 'false'
      widgets:
        - button:
            x: 10
            y: 10
            width: 78
            height: 32
            radius: 2
            bg_color: 0x1C1C20
            border_width: 1
            border_color: 0x69696E
            on_click:
              - lvgl.page.show:
                  id: core2_beer_opener_page
            widgets:
              - label:
                  align: CENTER
                  text: Back
                  text_font: roboto_small
                  text_color: 0xFFFFFF
        - label:
            align: CENTER
            text: Coming soon...
            text_font: roboto
            text_color: 0xFFFFFF