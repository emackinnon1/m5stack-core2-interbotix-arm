globals:
  - id: beer_opener_page_active
    type: bool
    restore_value: false
    initial_value: 'true'

image:
  - platform: file
    file: src/assets/images/beer-bottle.png
    id: core2_menu_icon_beer
    type: RGB565
    transparency: alpha_channel
    resize: 45x45

text_sensor:
  - platform: homeassistant
    id: beer_brand
    entity_id: input_select.beer_brands
    on_value:
      then:
        - lvgl.label.update:
            id: beer_brand_label
            text: !lambda 'return x;'

binary_sensor:
  - platform: homeassistant
    id: beer_opener_ready
    entity_id: binary_sensor.beer_opener_state_machine_is_ready
    trigger_on_initial_state: true
    on_state:
      then:
        - lvgl.label.update:
            id: beer_opener_status_label
            text: !lambda 'return std::string(x ? "Ready" : "Not ready");'
  - platform: homeassistant
    id: ros_process_running
    entity_id: binary_sensor.ros_process_is_running
    trigger_on_initial_state: true
    on_state:
      then:
        - lvgl.label.update:
            id: ros_process_status_label
            text: !lambda 'return std::string(x ? "Running" : "Stopped");'
  - platform: homeassistant
    id: beer_opener_running
    entity_id: binary_sensor.beer_opener_state_machine_is_running
    trigger_on_initial_state: true
    on_state:
      then:
        - lvgl.label.update:
            id: beer_opener_running_status_label
            text: !lambda 'return std::string(x ? "Running" : "Idle");'
  - platform: homeassistant
    id: ros_launch_process_running
    entity_id: binary_sensor.ros_status_launch_process_running
    trigger_on_initial_state: true
    on_state:
      then:
        - lvgl.label.update:
            id: ros_launch_status_label
            text: !lambda 'return std::string(x ? "Running" : "Stopped");'
  - platform: touchscreen
    id: core2_button_a
    x_min: 10
    x_max: 120
    y_min: 240
    y_max: 280
    use_raw: true
    on_press:
      - script.execute: core2_select_previous_beer
  - platform: touchscreen
    id: core2_button_b
    x_min: 130
    x_max: 200
    y_min: 240
    y_max: 280
    use_raw: true
    on_press:
      - script.execute: core2_open_selected_beer
  - platform: touchscreen
    id: core2_button_c
    x_min: 230
    x_max: 310
    y_min: 240
    y_max: 280
    use_raw: true
    on_press:
      - script.execute: core2_select_next_beer

script:
  - id: core2_select_previous_beer
    then:
      - if:
          condition:
            lambda: 'return id(beer_opener_page_active);'
          then:
            - homeassistant.action:
                action: input_select.select_previous
                data:
                  entity_id: input_select.beer_brands
  - id: core2_select_next_beer
    then:
      - if:
          condition:
            lambda: 'return id(beer_opener_page_active);'
          then:
            - homeassistant.action:
                action: input_select.select_next
                data:
                  entity_id: input_select.beer_brands
  - id: core2_open_selected_beer
    then:
      - if:
          condition:
            lambda: |-
              return id(beer_opener_page_active) &&
                     id(beer_opener_ready).state &&
                     id(ros_process_running).state &&
                     !id(beer_opener_running).state &&
                     id(ros_launch_process_running).state;
          then:
            - homeassistant.action:
                action: script.open_beer
                data_template:
                  beer_brand: "{{ selected_brand }}"
                variables:
                  selected_brand: !lambda 'return id(beer_brand).state;'

lvgl:
  displays: [core2_display]
  touchscreens:
    - touchscreen_id: core2_touchscreen
  default_font: roboto_small
  theme:
    dark_mode: true
  pages:
    - id: core2_beer_opener_page
      bg_color: 0x000000
      on_load:
        - globals.set:
            id: beer_opener_page_active
            value: 'true'
      widgets:
        - button:
            x: 208
            y: 8
            width: 102
            height: 32
            radius: 2
            bg_color: 0x1C1C20
            border_width: 1
            border_color: 0x69696E
            on_click:
              - lvgl.page.show:
                  id: core2_beer_brands_coming_soon_page
            widgets:
              - label:
                  align: CENTER
                  text: Add brand
                  text_font: roboto_small
                  text_color: 0xFFFFFF
        - image:
            x: 24
            y: 48
            src: core2_menu_icon_beer
        - label:
